<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RegOps Intelligence — Global Compliance Platform</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:        #080c14;
  --bg1:       #0d1420;
  --bg2:       #121a2b;
  --bg3:       #192236;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.12);
  --blue:      #3b82f6;
  --blue-dim:  rgba(59,130,246,0.15);
  --blue-glow: rgba(59,130,246,0.35);
  --teal:      #14b8a6;
  --teal-dim:  rgba(20,184,166,0.12);
  --amber:     #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --red:       #ef4444;
  --red-dim:   rgba(239,68,68,0.12);
  --green:     #22c55e;
  --green-dim: rgba(34,197,94,0.12);
  --text:      #f0f4ff;
  --text2:     #8896b3;
  --text3:     #4d5e80;
  --sidebar:   220px;
  --radius:    12px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow:hidden}
button{font-family:'DM Sans',sans-serif;cursor:pointer}
input,select{font-family:'DM Sans',sans-serif}

/* ── LAYOUT ─────────────────────────────────────── */
.shell{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ─────────────────────────────────────── */
.sidebar{
  width:var(--sidebar);flex-shrink:0;
  background:var(--bg1);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:0 0 1.5rem;
  position:relative;overflow:hidden;
}
.sidebar::before{
  content:'';position:absolute;top:-120px;left:-80px;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 70%);
  pointer-events:none;
}
.sidebar-logo{
  padding:1.5rem 1.25rem 1rem;
  border-bottom:1px solid var(--border);
  margin-bottom:0.75rem;
}
.logo-mark{
  display:flex;align-items:center;gap:0.625rem;
  text-decoration:none;
}
.logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--blue),var(--teal));
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
}
.logo-text{display:flex;flex-direction:column;line-height:1}
.logo-name{font-weight:700;font-size:1rem;letter-spacing:-0.02em;color:var(--text)}
.logo-sub{font-size:0.625rem;font-weight:500;color:var(--text2);letter-spacing:0.12em;text-transform:uppercase;margin-top:2px}

.nav-group-label{
  font-size:0.625rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text3);padding:0.75rem 1.25rem 0.375rem;
}
.nav-item{
  display:flex;align-items:center;gap:0.625rem;
  padding:0.625rem 1.25rem;margin:0 0.5rem;border-radius:8px;
  font-size:0.875rem;font-weight:500;color:var(--text2);
  cursor:pointer;transition:all 0.15s;border:none;background:none;
  width:calc(100% - 1rem);text-align:left;position:relative;
}
.nav-item:hover{color:var(--text);background:var(--bg2)}
.nav-item.active{color:var(--blue);background:var(--blue-dim)}
.nav-item.active::before{
  content:'';position:absolute;left:-0.5rem;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--blue);border-radius:0 3px 3px 0;
}
.nav-dot{
  width:6px;height:6px;border-radius:50%;background:var(--blue);
  margin-left:auto;animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
.nav-icon{font-size:1rem;width:18px;text-align:center}

.sidebar-footer{
  margin-top:auto;padding:1rem 1.25rem 0;
  border-top:1px solid var(--border);
}
.system-status{
  display:flex;align-items:flex-start;gap:0.625rem;
  padding:0.75rem;background:var(--green-dim);
  border:1px solid rgba(34,197,94,0.2);border-radius:8px;
}
.status-dot{
  width:8px;height:8px;border-radius:50%;background:var(--green);
  flex-shrink:0;margin-top:3px;
  box-shadow:0 0 6px var(--green);
  animation:pulse-dot 2s ease-in-out infinite;
}
.status-text{font-size:0.7rem;color:var(--green);line-height:1.4;font-weight:500}

.user-row{
  display:flex;align-items:center;gap:0.625rem;
  padding:0.875rem 0 0;
}
.avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--teal));
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;font-weight:700;color:#fff;flex-shrink:0;
}
.user-info{flex:1;min-width:0}
.user-name{font-size:0.8rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:0.65rem;color:var(--text2)}

/* ── MAIN ─────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── TOPBAR ───────────────────────────────────────── */
.topbar{
  height:56px;flex-shrink:0;
  background:var(--bg1);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.75rem;gap:1rem;
}
.breadcrumb{
  display:flex;align-items:center;gap:0.5rem;
  font-size:0.8rem;color:var(--text2);
}
.breadcrumb-sep{color:var(--text3)}
.breadcrumb-current{color:var(--text);font-weight:600}
.topbar-right{display:flex;align-items:center;gap:0.75rem}
.live-badge{
  display:flex;align-items:center;gap:0.5rem;
  padding:0.375rem 0.875rem;border-radius:20px;
  background:var(--green-dim);border:1px solid rgba(34,197,94,0.25);
  font-size:0.75rem;font-weight:600;color:var(--green);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-dot 1.5s ease-in-out infinite}
.ent-badge{
  padding:0.375rem 0.875rem;border-radius:6px;
  background:var(--bg3);border:1px solid var(--border2);
  font-size:0.75rem;font-weight:600;color:var(--text2);cursor:pointer;
  transition:all 0.15s;
}
.ent-badge:hover{color:var(--text);border-color:var(--blue)}
.notif-btn{
  width:32px;height:32px;border-radius:8px;
  background:var(--bg2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.15s;font-size:14px;
}
.notif-btn:hover{border-color:var(--blue);background:var(--blue-dim)}

/* ── CONTENT ─────────────────────────────────────── */
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.page{padding:1.75rem;animation:fadein 0.25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── HERO BANNER ─────────────────────────────────── */
.hero{
  border-radius:var(--radius);overflow:hidden;
  background:var(--bg2);border:1px solid var(--border);
  margin-bottom:1.5rem;position:relative;height:160px;
  display:flex;align-items:flex-end;padding:1.5rem;
}
.hero-bg{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#0d1f3c 0%,#0a1628 40%,#06101e 100%);
}
.hero-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(59,130,246,0.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(59,130,246,0.06) 1px,transparent 1px);
  background-size:28px 28px;
}
.hero-glow{
  position:absolute;top:-40px;right:80px;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(59,130,246,0.18) 0%,transparent 70%);
}
.hero-glow2{
  position:absolute;bottom:-60px;right:240px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,0.12) 0%,transparent 70%);
}
.hero-content{position:relative;z-index:1}
.hero-tag{
  display:inline-flex;align-items:center;gap:0.375rem;
  font-size:0.65rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--blue);margin-bottom:0.5rem;
}
.hero-tag-dot{width:5px;height:5px;border-radius:50%;background:var(--blue)}
.hero-title{font-size:1.625rem;font-weight:700;letter-spacing:-0.03em;line-height:1.2;margin-bottom:0.25rem}
.hero-title span{color:var(--blue)}
.hero-sub{font-size:0.8rem;color:var(--text2);max-width:420px;line-height:1.5}

/* ── KPI CARDS ────────────────────────────────────── */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.5rem}
.kpi{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);padding:1.25rem;
  transition:all 0.2s;cursor:default;position:relative;overflow:hidden;
}
.kpi::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--kpi-color,var(--blue)),transparent);
  opacity:0;transition:opacity 0.2s;
}
.kpi:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.3)}
.kpi:hover::after{opacity:1}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.875rem}
.kpi-icon{
  width:36px;height:36px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.kpi-trend{font-size:0.7rem;font-weight:600;display:flex;align-items:center;gap:2px}
.kpi-trend.up{color:var(--green)}
.kpi-trend.warn{color:var(--amber)}
.kpi-val{font-size:2rem;font-weight:700;letter-spacing:-0.04em;font-family:'DM Mono',monospace;line-height:1}
.kpi-label{font-size:0.75rem;color:var(--text2);margin-top:0.25rem;font-weight:500}

/* ── GRID 2-COL ──────────────────────────────────── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.5rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}

/* ── CARD ─────────────────────────────────────────── */
.card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;
}
.card-header{
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:1.25rem 1.25rem 0;margin-bottom:1rem;
}
.card-title{font-size:0.9rem;font-weight:600;color:var(--text);letter-spacing:-0.01em}
.card-sub{font-size:0.72rem;color:var(--text2);margin-top:2px}
.card-icon-btn{
  width:28px;height:28px;border-radius:7px;
  background:var(--bg3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;color:var(--text2);
  transition:all 0.15s;
}
.card-icon-btn:hover{color:var(--text);border-color:var(--blue)}
.card-body{padding:0 1.25rem 1.25rem}

/* ── CHART BARS ──────────────────────────────────── */
.bar-chart{display:flex;flex-direction:column;gap:0.625rem}
.bar-row{display:flex;align-items:center;gap:0.75rem}
.bar-label{font-size:0.75rem;color:var(--text2);width:64px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(0.34,1.56,0.64,1)}
.bar-val{font-size:0.7rem;font-family:'DM Mono',monospace;color:var(--text2);width:36px;flex-shrink:0}

/* ── RISK SEVERITY ───────────────────────────────── */
.sev-bars{display:flex;flex-direction:column;gap:0.75rem}
.sev-row{display:flex;align-items:center;gap:0.875rem}
.sev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sev-name{font-size:0.8rem;font-weight:500;color:var(--text);width:68px;flex-shrink:0}
.sev-track{flex:1;height:10px;background:var(--bg3);border-radius:5px;overflow:hidden}
.sev-fill{height:100%;border-radius:5px}
.sev-count{font-size:0.75rem;font-family:'DM Mono',monospace;color:var(--text2);width:28px;text-align:right;flex-shrink:0}

/* ── DONUT ────────────────────────────────────────── */
.donut-wrap{display:flex;align-items:center;gap:1.5rem}
.donut-svg{flex-shrink:0}
.donut-legend{display:flex;flex-direction:column;gap:0.625rem;flex:1}
.legend-row{display:flex;align-items:center;gap:0.5rem;font-size:0.78rem}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.legend-name{color:var(--text2);flex:1}
.legend-val{font-family:'DM Mono',monospace;color:var(--text);font-size:0.75rem;font-weight:600}

/* ── DEADLINE CARDS ──────────────────────────────── */
.deadline-list{display:flex;flex-direction:column;gap:0.625rem}
.deadline-item{
  display:flex;align-items:center;gap:0.875rem;
  padding:0.875rem;border-radius:9px;
  background:var(--bg3);border:1px solid var(--border);
  cursor:pointer;transition:all 0.15s;
}
.deadline-item:hover{border-color:var(--blue);background:var(--blue-dim)}
.deadline-icon{
  width:32px;height:32px;border-radius:8px;
  background:var(--blue-dim);border:1px solid rgba(59,130,246,0.2);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.deadline-info{flex:1;min-width:0}
.deadline-title{font-size:0.8rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deadline-meta{font-size:0.7rem;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:0.5rem}
.priority-pill{
  font-size:0.6rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;
}
.priority-critical{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.priority-high{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.2)}
.priority-medium{background:var(--blue-dim);color:var(--blue);border:1px solid rgba(59,130,246,0.2)}
.priority-low{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,0.2)}
.deadline-days{text-align:right;flex-shrink:0}
.days-num{font-size:1rem;font-weight:700;font-family:'DM Mono',monospace;color:var(--text);line-height:1}
.days-label{font-size:0.65rem;color:var(--text3)}

/* ── ANALYSIS SUMMARY ────────────────────────────── */
.progress-list{display:flex;flex-direction:column;gap:0.875rem}
.progress-row{display:flex;flex-direction:column;gap:0.375rem}
.progress-top{display:flex;justify-content:space-between;align-items:center}
.progress-label{font-size:0.8rem;color:var(--text2);font-weight:500}
.progress-val{font-size:0.8rem;font-weight:700;font-family:'DM Mono',monospace;color:var(--text)}
.progress-track{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width 1.2s cubic-bezier(0.34,1.56,0.64,1)}

.audit-ready{
  margin-top:1rem;padding:0.875rem;border-radius:9px;
  background:var(--blue-dim);border:1px solid rgba(59,130,246,0.2);
  display:flex;align-items:flex-start;gap:0.625rem;
}
.audit-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.audit-title{font-size:0.8rem;font-weight:600;color:var(--blue)}
.audit-sub{font-size:0.72rem;color:var(--text2);margin-top:2px;line-height:1.4}

/* ── PAGE TITLES ──────────────────────────────────── */
.page-header{margin-bottom:1.5rem}
.page-title{font-size:1.375rem;font-weight:700;letter-spacing:-0.03em;color:var(--text)}
.page-sub{font-size:0.8rem;color:var(--text2);margin-top:0.25rem}

/* ── UPLOAD ZONE ──────────────────────────────────── */
.upload-area{
  border:2px dashed var(--border2);border-radius:var(--radius);
  padding:3rem 2rem;text-align:center;cursor:pointer;
  transition:all 0.2s;background:var(--bg2);
  position:relative;overflow:hidden;
}
.upload-area::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--blue-dim),transparent 60%);
  opacity:0;transition:opacity 0.2s;
}
.upload-area:hover{border-color:var(--blue);background:var(--bg2)}
.upload-area:hover::before{opacity:1}
.upload-area.drag-over{border-color:var(--blue);background:var(--blue-dim)}
.upload-icon-wrap{
  width:56px;height:56px;border-radius:14px;
  background:var(--bg3);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;margin:0 auto 1rem;
  transition:all 0.2s;
}
.upload-area:hover .upload-icon-wrap{background:var(--blue-dim);border-color:rgba(59,130,246,0.4)}
.upload-title{font-size:0.9rem;font-weight:600;color:var(--text);margin-bottom:0.25rem}
.upload-sub{font-size:0.78rem;color:var(--text2)}
.upload-cta{
  display:inline-block;margin-top:1rem;
  font-size:0.78rem;font-weight:600;color:var(--blue);
  padding:0.5rem 1.25rem;border-radius:7px;
  border:1px solid rgba(59,130,246,0.3);background:var(--blue-dim);
  transition:all 0.15s;
}
.upload-area:hover .upload-cta{background:var(--blue);color:#fff}

.file-ready{
  display:flex;align-items:center;gap:0.875rem;
  padding:0.875rem 1rem;background:var(--green-dim);
  border:1px solid rgba(34,197,94,0.25);border-radius:9px;
  margin-bottom:1rem;
}
.file-ready-icon{font-size:20px;flex-shrink:0}
.file-ready-info{flex:1;min-width:0}
.file-ready-name{font-size:0.85rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-ready-size{font-size:0.72rem;color:var(--text2);margin-top:1px}
.file-remove{
  width:26px;height:26px;border-radius:6px;
  background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;cursor:pointer;color:var(--red);transition:all 0.15s;
}
.file-remove:hover{background:var(--red);color:#fff}

/* ── REGULATION SELECTOR ──────────────────────────── */
.reg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.75rem;margin-bottom:1.25rem}
.reg-card{
  padding:0.875rem;border-radius:9px;cursor:pointer;
  background:var(--bg2);border:1px solid var(--border);
  transition:all 0.15s;
}
.reg-card:hover{border-color:var(--border2);background:var(--bg3)}
.reg-card.selected{border-color:var(--blue);background:var(--blue-dim)}
.reg-flag{font-size:1.25rem;margin-bottom:0.375rem}
.reg-name{font-size:0.78rem;font-weight:600;color:var(--text);line-height:1.3}
.reg-region{font-size:0.68rem;color:var(--text2);margin-top:2px}
.auto-card{grid-column:1/-1}
.auto-card .reg-name{font-size:0.85rem}

/* ── BTN ──────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:0.5rem;
  padding:0.625rem 1.25rem;border-radius:8px;
  font-size:0.85rem;font-weight:600;cursor:pointer;
  transition:all 0.15s;border:none;
}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#2563eb;box-shadow:0 4px 16px var(--blue-glow)}
.btn-primary:disabled{opacity:0.45;cursor:not-allowed}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2)}
.btn-lg{padding:0.75rem 2rem;font-size:0.95rem;border-radius:10px}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.btn-danger:hover{background:var(--red);color:#fff}

/* ── LOADING ──────────────────────────────────────── */
.loading-wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4rem 2rem;
}
.spinner{
  width:48px;height:48px;border-radius:50%;
  border:3px solid var(--border2);border-top-color:var(--blue);

/* ── DONUT SVG ── */
function Donut({data,size=120,stroke=18}){
  const r=size/2-stroke/2;
  const circ=2*Math.PI*r;
  const total=data.reduce((s,d)=>s+d.val,0)||1;
  let offset=0;
  const segs=data.map(d=>{
    const pct=d.val/total;
    const dash=pct*circ;
    const seg={...d,offset,dash,pct};
    offset+=dash;
    return seg;
  });
  return(
    <svg width={size} height={size} className="donut-svg" style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg3)" strokeWidth={stroke}/>
      {segs.map((s,i)=>(
        <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
          stroke={s.color} strokeWidth={stroke}
          strokeDasharray={`${s.dash} ${circ-s.dash}`}
          strokeDashoffset={-s.offset}
          strokeLinecap="butt"
          style={{transition:'stroke-dasharray 1s ease'}}/>
      ))}
    </svg>
  );
}

/* ══ PAGE: EXTRACTION ENGINE ══ */
function PageEngine({regulations,results,setResults,setDocName,toast}){
  const [file,setFile]=useState(null);
  const [drag,setDrag]=useState(false);
  const [loading,setLoading]=useState(false);
  const [selReg,setSelReg]=useState('auto');
  const [filter,setFilter]=useState('all');
  const [search,setSearch]=useState('');
  const fileRef=useRef();

  const onFile=f=>{
    if(f&&f.type==='application/pdf'){setFile(f);setDocName(f.name);}
    else toast('Please drop a PDF file');
  };

  const analyze=async()=>{
    if(!file){toast('Select a file first');return;}
    setLoading(true);setResults(null);
    const fd=new FormData();fd.append('file',file);
    try{
      const url=selReg==='auto'?`${API}/analyze`:`${API}/analyze?regulation_id=${selReg}`;
      const res=await fetch(url,{method:'POST',body:fd});
      if(res.ok){const d=await res.json();setResults(d);toast(`✓ ${d.total_findings} findings extracted`);}
      else toast('Analysis failed — check backend');
    }catch{toast('Cannot connect to backend (localhost:8000)');}
    finally{setLoading(false);}
  };

  const exportCSV=()=>{
    if(!results)return;
    const rows=[['Page','Priority','Business Unit','Risk Score','Clause','Confidence']];
    results.results.forEach(r=>rows.push([r.page,r.priority,r.business_unit,r.risk_score,`"${r.clause.replace(/"/g,'""')}"`,r.confidence]));
    const csv=rows.map(r=>r.join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download=`compliance-${Date.now()}.csv`;a.click();
    toast('✓ CSV exported');
  };

  const findings=(results?.results||[]).filter(f=>{
    const pOk=filter==='all'||f.priority.toLowerCase()===filter;
    const sOk=!search||f.clause.toLowerCase().includes(search.toLowerCase())||f.business_unit.toLowerCase().includes(search.toLowerCase());
    return pOk&&sOk;
  });

  const regIcons={'auto':'🤖','us_sec_10k':'🇺🇸','eu_gdpr':'🇪🇺','soc2':'🌐','us_hipaa':'🏥','global_basel_iii':'🏦','eu_mifid_ii':'📈'};

  return(
    <div className="content">
      <div className="page">
        <div className="page-header">
          <div className="page-title">Regulatory Extraction Engine</div>
          <div className="page-sub">Upload and analyze documents for compliance obligations.</div>
        </div>

        <div className="grid-2" style={{gridTemplateColumns:'1fr 1.6fr',alignItems:'start'}}>
          {/* Left: upload + selector */}
          <div style={{display:'flex',flexDirection:'column',gap:'1rem'}}>
            {/* Upload */}
            <div className="card">
              <div className="card-header">
                <div className="card-title">Document Ingestion</div>
              </div>
              <div className="card-body">
                {file
                  ?<div className="file-ready">
                    <div className="file-ready-icon">📄</div>
                    <div className="file-ready-info">
                      <div className="file-ready-name">{file.name}</div>
                      <div className="file-ready-size">{(file.size/1024).toFixed(1)} KB • PDF</div>
                    </div>
                    <div className="file-remove" onClick={()=>{setFile(null);setResults(null);}}><Icon name="x"/></div>
                  </div>
                  :<div
                    className={`upload-area${drag?' drag-over':''}`}
                    onDragOver={e=>{e.preventDefault();setDrag(true)}}
                    onDragLeave={()=>setDrag(false)}
                    onDrop={e=>{e.preventDefault();setDrag(false);onFile(e.dataTransfer.files[0])}}
                    onClick={()=>fileRef.current.click()}
                  >
                    <div className="upload-icon-wrap">📄</div>
                    <div className="upload-title">Select PDF document</div>
                    <div className="upload-sub">Drag and drop or click to browse</div>
                    <div className="upload-cta">Browse files</div>
                    <input ref={fileRef} type="file" accept=".pdf" style={{display:'none'}} onChange={e=>onFile(e.target.files[0])}/>
                  </div>
                }
              </div>
            </div>

            {/* Regulation selector */}
            <div className="card">
              <div className="card-header"><div className="card-title">Select Framework</div></div>
              <div className="card-body">
                <div className="reg-grid">
                  <div className={`reg-card auto-card${selReg==='auto'?' selected':''}`} onClick={()=>setSelReg('auto')}>
                    <div className="reg-flag">🤖</div>
                    <div className="reg-name">Auto-Detect Framework</div>
                    <div className="reg-region">Recommended • AI-powered detection</div>
                  </div>
                  {regulations.map(r=>(
                    <div key={r.id} className={`reg-card${selReg===r.id?' selected':''}`} onClick={()=>setSelReg(r.id)}>
                      <div className="reg-flag">{regIcons[r.id]||'📋'}</div>
                      <div className="reg-name">{r.name}</div>
                      <div className="reg-region">{r.jurisdiction||r.region}</div>
                    </div>
                  ))}
                </div>
                <button className="btn btn-primary btn-lg" style={{width:'100%',justifyContent:'center'}} disabled={!file||loading} onClick={analyze}>
                  {loading?'⏳ Analyzing...':'⌕ Start Extraction'}
                </button>
              </div>
            </div>
          </div>

          {/* Right: results */}
          <div className="card" style={{minHeight:'500px'}}>
            <div className="card-header">
              <div>
                <div className="card-title">Extraction Results</div>
                <div className="card-sub">{results?`${results.regulation_name} • ${results.total_findings} findings`:'Processed regulatory artifacts and obligations'}</div>
              </div>
              {results&&<button className="btn btn-ghost" style={{fontSize:'0.75rem',padding:'0.375rem 0.75rem'}} onClick={exportCSV}>⬇ CSV</button>}
            </div>
            <div className="card-body">
              {loading&&(
                <div className="loading-wrap">
                  <div className="spinner"/>
                  <div className="loading-step">Deep-scanning document...</div>
                  <div className="loading-hint">Extracting obligations and assessing risk</div>
                  <div className="progress-bar-wrap"><div className="progress-bar-fill"/></div>
                </div>
              )}
              {!loading&&!results&&(
                <div className="empty">
                  <div className="empty-icon">🛡</div>
                  <div className="empty-title">No Active Analysis</div>
                  <div className="empty-sub">Upload a document to begin the deep-scan regulatory extraction process.</div>
                </div>
              )}
              {!loading&&results&&(
                <>
                  {/* Result KPIs */}
                  <div className="result-kpi">
                    {[
                      {val:results.total_findings,label:'Findings',color:'var(--blue)'},
                      {val:results.high_priority_count,label:'Critical',color:'var(--red)'},
                      {val:results.medium_priority_count,label:'Medium',color:'var(--amber)'},
                      {val:results.total_findings-results.high_priority_count-results.medium_priority_count,label:'Low',color:'var(--green)'},
                    ].map((k,i)=>(
                      <div className="result-kpi-card" key={i}>
                        <div className="result-kpi-val count-anim" style={{color:k.color}}>{k.val}</div>
                        <div className="result-kpi-label">{k.label}</div>
                      </div>
                    ))}
                  </div>

                  {/* Toolbar */}
                  <div className="findings-toolbar">
                    <div className="filter-tabs">
                      {['all','high','medium'].map(f=>(
                        <button key={f} className={`filter-tab${filter===f?' active':''}`} onClick={()=>setFilter(f)}>
                          {f==='all'?`All (${results.total_findings})`:f==='high'?`High (${results.high_priority_count})`:`Medium (${results.medium_priority_count})`}
                        </button>
                      ))}
                    </div>
                    <div className="search-box">
                      <span className="search-icon">⌕</span>
                      <input placeholder="Search clauses..." value={search} onChange={e=>setSearch(e.target.value)}/>
                    </div>
                  </div>

                  {/* Findings */}
                  <div className="finding-list" style={{maxHeight:'480px',overflowY:'auto',paddingRight:'4px'}}>
                    {findings.length===0
                      ?<div className="empty"><div className="empty-icon">🔍</div><div className="empty-title">No matches</div></div>
                      :findings.map((f,i)=>(
                        <div key={i} className={`finding ${f.priority.toLowerCase()}`} style={{animationDelay:`${i*0.04}s`}}>
                          <div className="finding-top">
                            <div className="finding-pills">
                              <span className={`pill pill-${f.priority.toLowerCase()}`}>{f.priority}</span>
                              <span className="pill pill-unit">{f.business_unit}</span>
                            </div>
                            <span style={{fontSize:'0.72rem',color:'var(--text3)',fontFamily:'DM Mono',flexShrink:0}}>p.{f.page}</span>
                          </div>
                          <div className="finding-clause">{f.clause}</div>
                          <div className="finding-footer">
                            <div className="risk-meter">
                              <div className="risk-pips">
                                {[1,2,3].map(p=>(
                                  <div key={p} className={`pip${p<=f.risk_score?' on':''}${p<=f.risk_score&&f.priority==='HIGH'?' risk-high':''}`}/>
                                ))}
                              </div>
                              <span className="risk-label">Risk {f.risk_score}/3</span>
                            </div>
                            <span className="conf-badge">{f.decision_source.toUpperCase()} · {Math.round(f.confidence*100)}%</span>
                          </div>
                        </div>
                      ))
                    }
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      </div>
      <Footer/>
    </div>
  );
}

/* ══ ROOT APP ══ */
function App(){
  const [page,setPage]=useState('overview');
  const [regulations,setRegulations]=useState([]);
  const [results,setResults]=useState(null);
  const [history,setHistory]=useState([]);
  const [docName,setDocName]=useState('Internal Corporate Policy v2');
  const [toastMsg,setToastMsg]=useState(null);

  const toast=useCallback(msg=>setToastMsg(msg),[]);

  useEffect(()=>{
    fetch(`${API}/regulations`)
      .then(r=>r.json())
      .then(d=>setRegulations(d))
      .catch(()=>{});
  },[]);

  useEffect(()=>{
    if(results){
      setHistory(h=>[{
        id:`RUN-${String(h.length+MOCK_HISTORY.length+1).padStart(6,'0')}`,
        file:results.filename,
        framework:results.regulation_name,
        findings:results.total_findings,
        date:new Date().toLocaleDateString(),
        status:'VERIFIED',
      },...h]);
    }
  },[results]);

  return(
    <div className="shell">
      <Sidebar page={page} setPage={setPage}/>
      <div className="main">
        <Topbar page={page} docName={docName}/>
        {page==='overview'&&<PageOverview results={results} regulations={regulations} setPage={setPage}/>}
        {page==='engine'&&<PageEngine regulations={regulations} results={results} setResults={setResults} setDocName={setDocName} toast={toast}/>}
        {page==='tasks'&&<PageTasks/>}
        {page==='trail'&&<PageTrail history={history}/>}
      </div>
      {toastMsg&&<Toast msg={toastMsg} onClose={()=>setToastMsg(null)}/>}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
