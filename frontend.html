<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Regulatory Compliance Auditor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #000000;
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #1a1a1a;
            --accent-primary: #00ff88;
            --accent-secondary: #00ccff;
            --accent-purple: #aa00ff;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --border: #222222;
            --glow-green: rgba(0, 255, 136, 0.3);
            --glow-blue: rgba(0, 204, 255, 0.3);
        }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated background grid */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Gradient orbs */
        .gradient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: var(--accent-primary);
            top: -200px;
            left: -200px;
            animation: float 15s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--accent-secondary);
            bottom: -100px;
            right: -100px;
            animation: float 12s ease-in-out infinite reverse;
        }

        .orb-3 {
            width: 500px;
            height: 500px;
            background: var(--accent-purple);
            top: 50%;
            left: 50%;
            animation: float 18s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        /* Intro Screen */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1s ease, transform 1s ease;
        }

        .intro-screen.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .intro-logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            margin-bottom: 2rem;
            animation: logoFloat 3s ease-in-out infinite;
            box-shadow: 0 20px 60px var(--glow-green);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .intro-title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: fadeInUp 1s ease 0.3s both;
        }

        .intro-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease 0.5s both;
        }

        .intro-features {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            animation: fadeInUp 1s ease 0.7s both;
        }

        .intro-feature {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .intro-feature-icon {
            color: var(--accent-primary);
            font-size: 1.25rem;
        }

        .intro-btn {
            padding: 1rem 3rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            font-size: 1.125rem;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            color: var(--bg-dark);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: fadeInUp 1s ease 0.9s both, pulse 2s ease-in-out 2s infinite;
            box-shadow: 0 10px 40px var(--glow-green);
        }

        .intro-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 60px var(--glow-green);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Main App Container */
        .app-container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .app-container.visible {
            opacity: 1;
        }

        /* Navigation */
        .nav {
            position: sticky;
            top: 0;
            padding: 1.5rem 2rem;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-logo-text {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .nav-stats {
            display: flex;
            gap: 1rem;
        }

        .nav-stat {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-stat-value {
            color: var(--accent-primary);
            font-weight: 600;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Section with stagger animation */
        .section {
            margin-bottom: 3rem;
            animation: fadeInUp 0.8s ease both;
        }

        .section:nth-child(1) { animation-delay: 0.1s; }
        .section:nth-child(2) { animation-delay: 0.2s; }
        .section:nth-child(3) { animation-delay: 0.3s; }
        .section:nth-child(4) { animation-delay: 0.4s; }

        /* Upload Zone */
        .upload-zone {
            position: relative;
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: 20px;
            padding: 4rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent,
                var(--accent-primary),
                transparent 30%
            );
            animation: rotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .upload-zone:hover::before {
            opacity: 0.1;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .upload-zone-content {
            position: relative;
            z-index: 1;
        }

        .upload-zone.dragging {
            border-color: var(--accent-primary);
            background: rgba(0, 255, 136, 0.05);
            transform: scale(1.02);
        }

        .upload-zone.has-file {
            border-color: var(--accent-primary);
            border-style: solid;
            background: rgba(0, 255, 136, 0.03);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .upload-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .upload-subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--accent-primary);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .file-badge-icon {
            font-size: 1.5rem;
        }

        .file-badge-remove {
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .file-badge-remove:hover {
            background: rgba(255, 0, 0, 0.2);
        }

        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Sora', sans-serif;
            color: var(--bg-dark);
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px var(--glow-green);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            border-color: var(--accent-primary);
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.1);
        }

        /* Regulation Cards */
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 30px;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 4px;
        }

        .regulation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .regulation-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .regulation-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .regulation-card:hover::before {
            opacity: 0.05;
        }

        .regulation-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 255, 136, 0.2);
        }

        .regulation-card.selected {
            border-color: var(--accent-primary);
            background: rgba(0, 255, 136, 0.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        .regulation-card-content {
            position: relative;
            z-index: 1;
        }

        .regulation-badge {
            display: inline-block;
            padding: 0.375rem 0.75rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .regulation-card h3 {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .regulation-card p {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
        }

        /* Action Section */
        .action-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .analyze-btn {
            padding: 1.25rem 3rem;
            font-size: 1.125rem;
            box-shadow: 0 10px 40px var(--glow-green);
        }

        /* Loading */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 2rem;
        }

        .loading-spinner {
            width: 80px;
            height: 80px;
            border: 4px solid var(--border);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 2rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .loading-subtext {
            color: var(--text-secondary);
        }

        .loading-progress {
            width: 300px;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            margin-top: 2rem;
            overflow: hidden;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            animation: progress 2s ease-in-out infinite;
        }

        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* Results */
        .results-header {
            text-align: center;
            padding: 3rem 0;
            animation: fadeInUp 0.8s ease;
        }

        .results-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s ease;
            animation: scaleIn 0.6s ease both;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stat-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 255, 136, 0.2);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        /* Filters */
        .filters-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .filters {
            display: flex;
            gap: 0.75rem;
        }

        .filter-btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-family: 'Sora', sans-serif;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-color: transparent;
            color: var(--bg-dark);
        }

        /* Findings */
        .findings-grid {
            display: grid;
            gap: 1.5rem;
        }

        .finding-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s ease;
            animation: slideInLeft 0.6s ease both;
        }

        .finding-card:nth-child(odd) {
            animation-name: slideInLeft;
        }

        .finding-card:nth-child(even) {
            animation-name: slideInRight;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .finding-card:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.15);
            transform: translateY(-2px);
        }

        .finding-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .finding-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .badge {
            padding: 0.375rem 0.875rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            border: 1px solid;
        }

        .badge.high {
            background: rgba(255, 0, 0, 0.1);
            border-color: rgba(255, 0, 0, 0.3);
            color: #ff3333;
        }

        .badge.medium {
            background: rgba(255, 170, 0, 0.1);
            border-color: rgba(255, 170, 0, 0.3);
            color: #ffaa00;
        }

        .badge.unit {
            background: rgba(170, 0, 255, 0.1);
            border-color: rgba(170, 0, 255, 0.3);
            color: #aa00ff;
        }

        .finding-content {
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .finding-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }

        .risk-indicator {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .risk-dots {
            display: flex;
            gap: 0.375rem;
        }

        .risk-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s ease;
        }

        .risk-dot.filled {
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        .confidence-badge {
            padding: 0.5rem 1rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent-primary);
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 6rem 2rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .empty-text {
            color: var(--text-secondary);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--accent-primary);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
            animation: slideInRight 0.3s ease;
            z-index: 10000;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .intro-title {
                font-size: 2rem;
            }

            .intro-features {
                flex-direction: column;
                gap: 1rem;
            }

            .regulation-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .filters-section {
                flex-direction: column;
                gap: 1rem;
            }

            .filters {
                width: 100%;
                flex-direction: column;
            }

            .filter-btn {
                width: 100%;
            }

            .nav-stats {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_URL = 'http://localhost:8000';

        function Toast({ message, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            return <div className="toast">{message}</div>;
        }

        function App() {
            const [showIntro, setShowIntro] = useState(true);
            const [regulations, setRegulations] = useState([]);
            const [selectedRegulation, setSelectedRegulation] = useState('auto');
            const [file, setFile] = useState(null);
            const [loading, setLoading] = useState(false);
            const [results, setResults] = useState(null);
            const [filter, setFilter] = useState('all');
            const [dragging, setDragging] = useState(false);
            const [toast, setToast] = useState(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                fetchRegulations();
            }, []);

            const fetchRegulations = async () => {
                try {
                    const response = await fetch(`${API_URL}/regulations`);
                    const data = await response.json();
                    setRegulations(data);
                } catch (error) {
                    console.error('Error:', error);
                }
            };

            const startApp = () => {
                setShowIntro(false);
            };

            const showToast = (message) => {
                setToast(message);
            };

            const handleFileChange = (e) => {
                const selectedFile = e.target.files[0];
                if (selectedFile && selectedFile.type === 'application/pdf') {
                    setFile(selectedFile);
                    showToast(`✓ Selected: ${selectedFile.name}`);
                } else {
                    showToast('⚠ Please select a PDF file');
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragging(true);
            };

            const handleDragLeave = () => {
                setDragging(false);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragging(false);
                
                const droppedFile = e.dataTransfer.files[0];
                if (droppedFile && droppedFile.type === 'application/pdf') {
                    setFile(droppedFile);
                    showToast(`✓ Dropped: ${droppedFile.name}`);
                } else {
                    showToast('⚠ Please drop a PDF file');
                }
            };

            const handleRemoveFile = () => {
                setFile(null);
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
                showToast('✓ File removed');
            };

            const handleAnalyze = async () => {
                if (!file) {
                    showToast('⚠ Please select a file first');
                    return;
                }

                setLoading(true);
                setResults(null);

                const formData = new FormData();
                formData.append('file', file);

                try {
                    const url = selectedRegulation === 'auto' 
                        ? `${API_URL}/analyze`
                        : `${API_URL}/analyze?regulation_id=${selectedRegulation}`;

                    const response = await fetch(url, {
                        method: 'POST',
                        body: formData,
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setResults(data);
                        showToast(`✓ Analysis complete: ${data.total_findings} findings`);
                        
                        // Scroll to results
                        setTimeout(() => {
                            document.getElementById('results')?.scrollIntoView({ 
                                behavior: 'smooth',
                                block: 'start'
                            });
                        }, 300);
                    } else {
                        showToast('⚠ Analysis failed');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showToast('⚠ Error connecting to server');
                } finally {
                    setLoading(false);
                }
            };

            const exportResults = () => {
                if (!results) return;
                
                const dataStr = JSON.stringify(results, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const exportFileDefaultName = `compliance-report-${Date.now()}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                showToast('✓ Report exported');
            };

            const filteredResults = results?.results.filter(r => {
                if (filter === 'all') return true;
                return r.priority.toLowerCase() === filter;
            }) || [];

            if (showIntro) {
                return (
                    <div className="intro-screen">
                        <div className="intro-logo">⚖</div>
                        <h1 className="intro-title">Regulatory Auditor</h1>
                        <p className="intro-subtitle">
                            AI-Powered Multi-Jurisdiction Compliance Analysis
                        </p>
                        <div className="intro-features">
                            <div className="intro-feature">
                                <span className="intro-feature-icon">✓</span>
                                <span>Auto-Detection</span>
                            </div>
                            <div className="intro-feature">
                                <span className="intro-feature-icon">✓</span>
                                <span>4 Frameworks</span>
                            </div>
                            <div className="intro-feature">
                                <span className="intro-feature-icon">✓</span>
                                <span>Risk Scoring</span>
                            </div>
                        </div>
                        <button className="intro-btn" onClick={startApp}>
                            Get Started →
                        </button>
                    </div>
                );
            }

            return (
                <div className={`app-container ${!showIntro ? 'visible' : ''}`}>
                    <nav className="nav">
                        <div className="nav-content">
                            <div className="nav-logo">
                                <div className="nav-logo-icon">⚖</div>
                                <span className="nav-logo-text">Regulatory Auditor</span>
                            </div>
                            <div className="nav-stats">
                                <div className="nav-stat">
                                    Frameworks: <span className="nav-stat-value">{regulations.length}</span>
                                </div>
                                {results && (
                                    <div className="nav-stat">
                                        Findings: <span className="nav-stat-value">{results.total_findings}</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    </nav>

                    <div className="container">
                        {/* Upload Section */}
                        <div className="section">
                            <div 
                                className={`upload-zone ${dragging ? 'dragging' : ''} ${file ? 'has-file' : ''}`}
                                onDragOver={handleDragOver}
                                onDragLeave={handleDragLeave}
                                onDrop={handleDrop}
                            >
                                <div className="upload-zone-content">
                                    <div className="upload-icon">
                                        {file ? '✓' : '📄'}
                                    </div>
                                    <h2 className="upload-title">
                                        {file ? 'Document Ready' : 'Upload Document'}
                                    </h2>
                                    <p className="upload-subtitle">
                                        {file ? 'Ready to analyze' : 'Drag & drop your PDF or click to browse'}
                                    </p>
                                    
                                    {file && (
                                        <div className="file-badge">
                                            <span className="file-badge-icon">📎</span>
                                            <span>{file.name}</span>
                                            <span className="file-badge-remove" onClick={handleRemoveFile}>
                                                ✕
                                            </span>
                                        </div>
                                    )}
                                    
                                    <input
                                        ref={fileInputRef}
                                        type="file"
                                        style={{ display: 'none' }}
                                        id="fileInput"
                                        accept=".pdf"
                                        onChange={handleFileChange}
                                    />
                                    <label htmlFor="fileInput" className="btn">
                                        {file ? '📂 Change File' : '📁 Select PDF'}
                                    </label>
                                </div>
                            </div>
                        </div>

                        {/* Regulation Selector */}
                        <div className="section">
                            <h2 className="section-title">Choose Framework</h2>
                            <div className="regulation-grid">
                                <div
                                    className={`regulation-card ${selectedRegulation === 'auto' ? 'selected' : ''}`}
                                    onClick={() => setSelectedRegulation('auto')}
                                >
                                    <div className="regulation-card-content">
                                        <span className="regulation-badge">Recommended</span>
                                        <h3>🤖 Auto Detection</h3>
                                        <p>Automatically detect regulation type from document content</p>
                                    </div>
                                </div>
                                {regulations.map(reg => (
                                    <div
                                        key={reg.id}
                                        className={`regulation-card ${selectedRegulation === reg.id ? 'selected' : ''}`}
                                        onClick={() => setSelectedRegulation(reg.id)}
                                    >
                                        <div className="regulation-card-content">
                                            <span className="regulation-badge">{reg.region}</span>
                                            <h3>{reg.name}</h3>
                                            <p>{reg.description}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Action Section */}
                        <div className="section">
                            <div className="action-section">
                                <button
                                    className="btn analyze-btn"
                                    onClick={handleAnalyze}
                                    disabled={!file || loading}
                                >
                                    {loading ? '⏳ Analyzing...' : '🚀 Analyze Document'}
                                </button>
                            </div>
                        </div>

                        {/* Loading */}
                        {loading && (
                            <div className="loading-screen">
                                <div className="loading-spinner"></div>
                                <h3 className="loading-text">Analyzing Compliance...</h3>
                                <p className="loading-subtext">Extracting obligations and assessing risks</p>
                                <div className="loading-progress">
                                    <div className="loading-progress-bar"></div>
                                </div>
                            </div>
                        )}

                        {/* Results */}
                        {results && !loading && (
                            <div id="results">
                                <div className="results-header">
                                    <h2 className="results-title">Analysis Complete</h2>
                                    <p className="results-subtitle">
                                        {results.regulation_name} • {results.filename}
                                    </p>
                                </div>

                                {/* Stats */}
                                <div className="stats-grid">
                                    <div className="stat-card">
                                        <div className="stat-icon">📊</div>
                                        <div className="stat-value">{results.total_findings}</div>
                                        <div className="stat-label">Total Findings</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-icon">🔴</div>
                                        <div className="stat-value">{results.high_priority_count}</div>
                                        <div className="stat-label">High Priority</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-icon">🟡</div>
                                        <div className="stat-value">{results.medium_priority_count}</div>
                                        <div className="stat-label">Medium Priority</div>
                                    </div>
                                    <div className="stat-card">
                                        <div className="stat-icon">✓</div>
                                        <div className="stat-value" style={{ fontSize: '1.5rem' }}>
                                            {results.regulation_name}
                                        </div>
                                        <div className="stat-label">Framework</div>
                                    </div>
                                </div>

                                {/* Filters */}
                                <div className="filters-section">
                                    <div className="filters">
                                        <button
                                            className={`filter-btn ${filter === 'all' ? 'active' : ''}`}
                                            onClick={() => setFilter('all')}
                                        >
                                            All ({results.total_findings})
                                        </button>
                                        <button
                                            className={`filter-btn ${filter === 'high' ? 'active' : ''}`}
                                            onClick={() => setFilter('high')}
                                        >
                                            High ({results.high_priority_count})
                                        </button>
                                        <button
                                            className={`filter-btn ${filter === 'medium' ? 'active' : ''}`}
                                            onClick={() => setFilter('medium')}
                                        >
                                            Medium ({results.medium_priority_count})
                                        </button>
                                    </div>
                                    <button className="btn-secondary btn" onClick={exportResults}>
                                        ⬇ Export JSON
                                    </button>
                                </div>

                                {/* Findings */}
                                {filteredResults.length > 0 ? (
                                    <div className="findings-grid">
                                        {filteredResults.map((finding, idx) => (
                                            <div key={idx} className="finding-card" style={{ animationDelay: `${idx * 0.05}s` }}>
                                                <div className="finding-header">
                                                    <div className="finding-badges">
                                                        <span className={`badge ${finding.priority.toLowerCase()}`}>
                                                            {finding.priority}
                                                        </span>
                                                        <span className="badge unit">
                                                            {finding.business_unit}
                                                        </span>
                                                    </div>
                                                </div>
                                                <div className="finding-content">
                                                    {finding.clause}
                                                </div>
                                                <div className="finding-footer">
                                                    <div className="risk-indicator">
                                                        <span style={{ color: 'var(--text-secondary)', fontSize: '0.875rem' }}>
                                                            Risk Level:
                                                        </span>
                                                        <div className="risk-dots">
                                                            {[1, 2, 3].map(dot => (
                                                                <div
                                                                    key={dot}
                                                                    className={`risk-dot ${dot <= finding.risk_score ? 'filled' : ''}`}
                                                                />
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <div className="confidence-badge">
                                                        {finding.decision_source.toUpperCase()} • {(finding.confidence * 100).toFixed(0)}%
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="empty-state">
                                        <div className="empty-icon">🔍</div>
                                        <h3 className="empty-title">No Results</h3>
                                        <p className="empty-text">Try selecting a different filter</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Empty State */}
                        {!results && !loading && (
                            <div className="empty-state">
                                <div className="empty-icon">📊</div>
                                <h3 className="empty-title">Ready to Analyze</h3>
                                <p className="empty-text">Upload a document and select a framework to begin</p>
                            </div>
                        )}
                    </div>

                    {/* Toast */}
                    {toast && <Toast message={toast} onClose={() => setToast(null)} />}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
